server {
    listen 80;
    server_name blog3.localhost;
    
    root /usr/share/nginx/html/blog3;
    index index.html index.htm;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}